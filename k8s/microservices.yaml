# Déploiement des micro-services + routage via l'Ingress Gateway Istio.
# Les services sont exposés sous /order-service/ et /stock-service/ (préfixe retiré par la VirtualService).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-service
  labels:
    app: stock-service
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock-service
  template:
    metadata:
      labels:
        app: stock-service
        version: "1.0"
    spec:
      containers:
        - name: stock-service
          image: stock-service:1
          imagePullPolicy: IfNotPresent   # image construite dans le Docker de minikube
          ports:
            - containerPort: 8081
          livenessProbe:
            initialDelaySeconds: 60
            httpGet:
              path: /actuator/health/liveness
              port: 8081
          readinessProbe:
            initialDelaySeconds: 20
            httpGet:
              path: /actuator/health/readiness
              port: 8081
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: stock-service
  labels:
    app: stock-service
spec:
  selector:
    app: stock-service
  ports:
    - name: http          # le préfixe "http" est utilisé par Istio pour détecter le protocole
      port: 8081
      targetPort: 8081
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: stock-service
spec:
  hosts:
    - "*"
  gateways:
    - microservice-gateway
  http:
    - match:
        - uri:
            prefix: /stock-service/
      rewrite:
        uri: /
      route:
        - destination:
            host: stock-service.default.svc.cluster.local
            port:
              number: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        version: "1.0"
    spec:
      containers:
        - name: order-service
          image: order-service:1
          imagePullPolicy: IfNotPresent
          env:
            - name: STOCK_SERVICE_URL     # appel inter-services via le DNS Kubernetes (et le sidecar Istio)
              value: http://stock-service:8081
          ports:
            - containerPort: 8080
          livenessProbe:
            initialDelaySeconds: 60
            httpGet:
              path: /actuator/health/liveness
              port: 8080
          readinessProbe:
            initialDelaySeconds: 20
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: order-service
spec:
  hosts:
    - "*"
  gateways:
    - microservice-gateway
  http:
    - match:
        - uri:
            prefix: /order-service/
      rewrite:
        uri: /
      route:
        - destination:
            host: order-service.default.svc.cluster.local
            port:
              number: 8080
