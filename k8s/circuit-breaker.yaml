# Circuit breaker sur stock-service (appelé par order-service).
# - connectionPool : limite les requêtes concurrentes / en attente (au-delà : 503 immédiat)
# - outlierDetection : éjecte un pod après 3 erreurs 5xx consécutives pendant 30 s
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: stock-service
spec:
  host: stock-service.default.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 20
      http:
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
