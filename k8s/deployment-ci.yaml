# Déploiement minimal utilisé par le workflow GitHub Actions (minikube sans Istio) :
# images locales, un seul réplica, pas de VirtualService.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-service
  labels: { app: stock-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: stock-service }
  template:
    metadata:
      labels: { app: stock-service }
    spec:
      containers:
        - name: stock-service
          image: local/stock-service:latest
          imagePullPolicy: Never
          ports: [ { containerPort: 8081 } ]
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
---
apiVersion: v1
kind: Service
metadata:
  name: stock-service
  labels: { app: stock-service }
spec:
  selector: { app: stock-service }
  ports:
    - { name: http, port: 8081, targetPort: 8081 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels: { app: order-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: local/order-service:latest
          imagePullPolicy: Never
          env:
            - { name: STOCK_SERVICE_URL, value: "http://stock-service:8081" }
          ports: [ { containerPort: 8080 } ]
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels: { app: order-service }
spec:
  type: NodePort
  selector: { app: order-service }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
