spring.application.name=order-service
server.port=8080

spring.datasource.url=jdbc:h2:mem:projetdevops
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# URL du micro-service de stock (surchargeable via la variable d'environnement STOCK_SERVICE_URL)
stock.service.url=${STOCK_SERVICE_URL:http://localhost:8081}

# Sondes liveness / readiness pour Kubernetes (/actuator/health/liveness et /readiness)
management.endpoint.health.probes.enabled=true
management.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
