# Lancement des deux micro-services (après `mvn -B package`) :
#   docker compose up --build
services:
  stock-service:
    build: ./stock-service
    ports:
      - "8081:8081"

  order-service:
    build: ./order-service
    ports:
      - "8080:8080"
    environment:
      STOCK_SERVICE_URL: http://stock-service:8081
    depends_on:
      - stock-service
