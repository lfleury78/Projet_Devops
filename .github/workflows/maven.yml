# Build, tests, couverture et analyse Sonar des micro-services (order-service, stock-service).
name: Java CI with Maven

on:
  push:
    branches: [ "main", "tests", "JaCoCo", "SonarCloud" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-service
            tests: "UserServiceTest,OrderServiceTest,StockClientTest"
          - service: stock-service
            tests: "StockServiceTest"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn -B test -pl ${{ matrix.service }} -Dtest="${{ matrix.tests }}" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/

  web-tests:
    name: Web Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-service
            tests: "UserControllerTest,OrderControllerTest"
          - service: stock-service
            tests: "StockControllerTest"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run web (MockMvc) tests
        run: mvn -B test -pl ${{ matrix.service }} -Dtest="${{ matrix.tests }}" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload web test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/

  build:
    name: Full Build & Package
    runs-on: ubuntu-latest
    needs: [ unit-tests, web-tests ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run all tests (all modules)
        run: mvn -B verify --file pom.xml

      - name: Upload order-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: order-service-jar
          path: order-service/target/*.jar
          if-no-files-found: warn

      - name: Upload stock-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: stock-service-jar
          path: stock-service/target/*.jar
          if-no-files-found: warn

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            order-service/target/site/jacoco/
            stock-service/target/site/jacoco/

      - name: Build Docker images
        run: |
          docker build -t order-service:ci order-service
          docker build -t stock-service:ci stock-service

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
